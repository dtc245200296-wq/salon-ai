{% extends 'admin_base.html' %}

{% block content %}
<h2>AI gợi ý dịch vụ</h2>
<div class="card p-3">
  <select id="customerId" class="form-select mb-3">
    {% for c in customers %}
      <option value="{{ c.id }}">{{ c.full_name }}</option>
    {% endfor %}
  </select>
  <button class="btn btn-primary" onclick="recommend()">Sinh gợi ý</button>
  <pre id="result" class="ai-result mt-3"></pre>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function recommend() {
    const id = document.getElementById('customerId').value;
    const r = await fetch('/api/ai/recommend', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ customer_id: id })
    });
    const data = await r.json();
    const result = document.getElementById('result');
    result.innerHTML = typeof window.renderAiRecommendation === 'function'
      ? window.renderAiRecommendation(data)
      : (data.reply || data.summary || JSON.stringify(data, null, 2));
  }
</script>
{% endblock %}
